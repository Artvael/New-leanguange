<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Gradient Apel -->
    <linearGradient id="appleGrad" x1="20%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FF4B4B" />
      <stop offset="50%" stop-color="#E62E5C" />
      <stop offset="100%" stop-color="#990033" />
    </linearGradient>

    <!-- Gradient Daun -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E62" />
      <stop offset="100%" stop-color="#D6244C" />
    </linearGradient>

    <!-- Gradient Core / Inti Kristal -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="40%" stop-color="#FF6699" />
      <stop offset="70%" stop-color="#8A2BE2" />
      <stop offset="100%" stop-color="#00FFFF" />
    </linearGradient>

    <!-- Efek Glow Inti -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Mask untuk Apel Tergigit -->
    <mask id="appleMask">
      <rect width="128" height="128" fill="white" />
      <!-- Gigitan di sebelah kanan -->
      <circle cx="108" cy="68" r="24" fill="black" />
    </mask>
  </defs>

  <!-- Daun di atas -->
  <path d="M68,14 C78,12 88,20 86,34 C74,36 64,28 68,14 Z" fill="url(#leafGrad)" />

  <!-- Badan Apel dengan Mask Gigitan -->
  <g mask="url(#appleMask)">
    <!-- Siluet Apel -->
    <path d="M64,36 C50,22 24,24 16,48 C8,72 20,112 50,118 C58,120 62,116 64,116 C66,116 70,120 78,118 C108,112 120,72 112,48 C104,24 78,22 64,36 Z" 
          fill="url(#appleGrad)" stroke="#FF8DA1" stroke-width="2" />
  </g>

  <!-- Border efek gigitan -->
  <path d="M96,48 C100,56 100,76 94,88" fill="none" stroke="#FF8DA1" stroke-width="3" stroke-linecap="round" />

  <!-- Sirkuit Logika di dalam Apel -->
  <g stroke="#FFA3B8" stroke-width="1.8" fill="none" opacity="0.85" stroke-linecap="round">
    <path d="M36,54 L28,62 L28,82 L34,88" />
    <path d="M42,42 L42,48 L34,54" />
    <path d="M78,42 L78,48 L86,54" />
    <circle cx="28" cy="62" r="2.5" fill="#FFA3B8" />
    <circle cx="34" cy="88" r="2.5" fill="#FFA3B8" />
    <circle cx="78" cy="42" r="2.5" fill="#FFA3B8" />
  </g>

  <!-- Inti Kristal Logika (Core Gem) -->
  <g filter="url(#glow)">
    <!-- Berlian Utama -->
    <polygon points="60,46 76,68 60,94 44,68" fill="url(#coreGrad)" opacity="0.95" />
    <!-- Garis Facet Kristal -->
    <polygon points="60,46 60,94 44,68" fill="#FFFFFF" opacity="0.3" />
    <polygon points="60,46 68,68 60,94" fill="#00FFFF" opacity="0.4" />
    <line x1="44" y1="68" x2="76" y2="68" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8" />
    <!-- Titik Cahaya Pusat -->
    <circle cx="60" cy="68" r="3" fill="#FFFFFF" />
  </g>
</svg>
